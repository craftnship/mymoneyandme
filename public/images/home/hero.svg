  <g transform="translate(470 170)">
    <circle r="92" fill="url(#coin)" stroke="#c9861f" stroke-width="6"/>
    <circle r="72" fill="none" stroke="#fff3d6" stroke-width="4" opacity=".7"/>
    <path d="M-34 -42 H34 M-34 -18 H34 M-34 -42 C 20 -42 26 6 -30 6 L 26 52" fill="none" stroke="#8a5a12" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#fff" opacity=".9"><ellipse cx="180" cy="170" rx="80" ry="26"/><ellipse cx="230" cy="150" rx="60" ry="28"/><ellipse cx="700" cy="110" rx="70" ry="22"/><ellipse cx="740" cy="95" rx="46" ry="22"/></g>
</svg>
