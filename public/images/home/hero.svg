<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9efe7"/><stop offset="1" stop-color="#fdf3e1"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7c35f"/><stop offset="1" stop-color="#e09a2b"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="930" cy="210" r="120" fill="#f6b84b" opacity=".9"/>
  <circle cx="930" cy="210" r="170" fill="#f6b84b" opacity=".18"/>
  <path d="M0 650 C 220 560 380 600 560 640 S 920 560 1200 610 V900 H0Z" fill="#9fd3bf"/>
  <path d="M0 720 C 260 660 470 700 700 730 S 1050 690 1200 700 V900 H0Z" fill="#5fb08f"/>
  <path d="M0 800 C 300 760 600 790 1200 770 V900 H0Z" fill="#0f6e56"/>
  <!-- house -->
  <g transform="translate(150 430)">
    <rect x="20" y="110" width="240" height="190" fill="#fffaf0"/>
    <path d="M0 120 L140 10 L280 120 Z" fill="#e76f51"/>
    <rect x="115" y="190" width="56" height="110" rx="6" fill="#264653"/>
    <rect x="45" y="150" width="50" height="46" rx="4" fill="#a8dadc"/>
    <rect x="190" y="150" width="50" height="46" rx="4" fill="#a8dadc"/>
    <rect x="200" y="40" width="30" height="60" fill="#c95a3f"/>
  </g>
  <!-- growth bars -->
  <g transform="translate(520 380)">
