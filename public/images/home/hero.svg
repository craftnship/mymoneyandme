    <rect x="95" y="170" width="70" height="180" rx="10" fill="#264653" opacity=".9"/>
    <rect x="190" y="90" width="70" height="260" rx="10" fill="#264653"/>
    <path d="M10 200 L130 140 L220 60 L300 10" fill="none" stroke="#e76f51" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M300 10 l-52 8 l34 38 z" fill="#e76f51"/>
  </g>
  <!-- coin stacks -->
  <g transform="translate(860 500)">
    <g fill="url(#coin)" stroke="#c9861f" stroke-width="3">
      <ellipse cx="60" cy="230" rx="60" ry="18"/><ellipse cx="60" cy="210" rx="60" ry="18"/><ellipse cx="60" cy="190" rx="60" ry="18"/>
      <ellipse cx="60" cy="170" rx="60" ry="18"/><ellipse cx="60" cy="150" rx="60" ry="18"/>
      <ellipse cx="190" cy="230" rx="60" ry="18"/><ellipse cx="190" cy="210" rx="60" ry="18"/><ellipse cx="190" cy="190" rx="60" ry="18"/>
      <ellipse cx="190" cy="170" rx="60" ry="18"/><ellipse cx="190" cy="150" rx="60" ry="18"/><ellipse cx="190" cy="130" rx="60" ry="18"/>
      <ellipse cx="190" cy="110" rx="60" ry="18"/><ellipse cx="190" cy="90" rx="60" ry="18"/>
    </g>
    <!-- sprout -->
    <path d="M190 72 C 190 40 190 20 190 0" stroke="#0f6e56" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M190 30 C 150 30 130 0 130 -20 C 170 -20 190 5 190 30Z" fill="#2f9c78"/>
    <path d="M190 14 C 230 14 255 -15 255 -40 C 210 -40 190 -10 190 14Z" fill="#3fb58c"/>
  </g>
